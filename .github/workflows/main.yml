name: Weekly School Data Scraper

on:
  schedule:
    - cron: '0 8 * * 1'   # Runs automatically every Monday at 8:00 AM UTC
  workflow_dispatch:        # Enables the manual "Run workflow" button in GitHub

jobs:
  scrape-and-update:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install pandas requests beautifulsoup4

      - name: Run Scraper
        run: python scraper.py

      - name: Save and Commit Changes
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add hongkong_schools.csv
          git diff --quiet && git diff --staged --quiet || (git commit -m "Auto-update photos and data" && git push)
